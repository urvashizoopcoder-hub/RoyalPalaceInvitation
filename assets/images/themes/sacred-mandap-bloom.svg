<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 450' width='100%' height='100%'>
  <defs>
    <linearGradient id='skyGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#7CB9E8'/>
      <stop offset='45%' stop-color='#A0D2EB'/>
      <stop offset='80%' stop-color='#E5F0F8'/>
      <stop offset='100%' stop-color='#FFFDF9'/>
    </linearGradient>
    <linearGradient id='ganeshaRed' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#DC2626'/>
      <stop offset='60%' stop-color='#991B1B'/>
      <stop offset='100%' stop-color='#7F1D1D'/>
    </linearGradient>
    <linearGradient id='goldShimmer' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FDE047'/>
      <stop offset='50%' stop-color='#D4AF37'/>
      <stop offset='100%' stop-color='#996515'/>
    </linearGradient>
    <linearGradient id='rosePetal1' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FDA4AF'/>
      <stop offset='100%' stop-color='#E11D48'/>
    </linearGradient>
    <linearGradient id='rosePetal2' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FED7AA'/>
      <stop offset='100%' stop-color='#FB923C'/>
    </linearGradient>
    <filter id='divineGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <!-- Clear Scenic Sky Background -->
  <rect width='600' height='450' fill='url(#skyGrad)'/>

  <!-- Side Floral Pillars (Left & Right) -->
  <g opacity='0.9'>
    <!-- Left Pillar Drapes & Vines -->
    <path d='M0 0 L55 0 L50 450 L0 450 Z' fill='rgba(255,255,255,0.7)'/>
    <path d='M25 0 Q35 220 20 450' stroke='#15803D' stroke-width='6' fill='none'/>
    <g fill='#E11D48'>
      <circle cx='25' cy='60' r='12'/><circle cx='30' cy='140' r='14'/><circle cx='22' cy='220' r='13'/>
      <circle cx='28' cy='300' r='14'/><circle cx='24' cy='380' r='12'/>
    </g>
    <g fill='#FDE047'>
      <circle cx='32' cy='95' r='8'/><circle cx='20' cy='175' r='9'/><circle cx='34' cy='255' r='8'/><circle cx='18' cy='340' r='9'/>
    </g>

    <!-- Right Pillar Drapes & Vines -->
    <path d='M545 0 L600 0 L600 450 L550 450 Z' fill='rgba(255,255,255,0.7)'/>
    <path d='M575 0 Q565 220 580 450' stroke='#15803D' stroke-width='6' fill='none'/>
    <g fill='#E11D48'>
      <circle cx='575' cy='60' r='12'/><circle cx='570' cy='140' r='14'/><circle cx='578' cy='220' r='13'/>
      <circle cx='572' cy='300' r='14'/><circle cx='576' cy='380' r='12'/>
    </g>
    <g fill='#FDE047'>
      <circle cx='568' cy='95' r='8'/><circle cx='580' cy='175' r='9'/><circle cx='566' cy='255' r='8'/><circle cx='582' cy='340' r='9'/>
    </g>
  </g>

  <!-- Top Dense Floral Mandap Canopy Beam -->
  <rect x='0' y='0' width='600' height='55' fill='rgba(255,255,255,0.4)'/>
  
  <!-- Foliage Layer -->
  <path d='M0 45 Q150 70 300 45 Q450 70 600 45 L600 0 L0 0 Z' fill='#166534'/>
  
  <!-- Dense Blooming Roses & Peonies on Main Beam -->
  <g>
    <!-- Coral & Peach Roses -->
    <circle cx='30' cy='30' r='20' fill='url(#rosePetal2)'/><circle cx='80' cy='25' r='22' fill='url(#rosePetal1)'/>
    <circle cx='130' cy='32' r='24' fill='#FFF1F2'/><circle cx='180' cy='28' r='22' fill='url(#rosePetal2)'/>
    <circle cx='230' cy='30' r='25' fill='url(#rosePetal1)'/><circle cx='280' cy='26' r='23' fill='#FFE4E6'/>
    <circle cx='320' cy='26' r='23' fill='url(#rosePetal2)'/><circle cx='370' cy='30' r='25' fill='url(#rosePetal1)'/>
    <circle cx='420' cy='28' r='22' fill='#FFF1F2'/><circle cx='470' cy='32' r='24' fill='url(#rosePetal2)'/>
    <circle cx='520' cy='25' r='22' fill='url(#rosePetal1)'/><circle cx='570' cy='30' r='20' fill='url(#rosePetal2)'/>
    
    <!-- Deep Red & Crimson Accents -->
    <circle cx='55' cy='38' r='14' fill='#991B1B'/><circle cx='105' cy='40' r='15' fill='#BE123C'/>
    <circle cx='155' cy='36' r='14' fill='#991B1B'/><circle cx='205' cy='42' r='16' fill='#BE123C'/>
    <circle cx='255' cy='38' r='15' fill='#991B1B'/><circle cx='345' cy='38' r='15' fill='#991B1B'/>
    <circle cx='395' cy='42' r='16' fill='#BE123C'/><circle cx='445' cy='36' r='14' fill='#991B1B'/>
    <circle cx='495' cy='40' r='15' fill='#BE123C'/><circle cx='545' cy='38' r='14' fill='#991B1B'/>
  </g>

  <!-- 3 Hanging Draped Jasmine & Mogra Garland Swags -->
  <!-- Left Swag -->
  <path d='M30 45 Q120 155 210 50' stroke='#FEF08A' stroke-width='14' stroke-linecap='round' fill='none'/>
  <path d='M30 45 Q120 155 210 50' stroke='#FACC15' stroke-width='6' stroke-dasharray='6 8' fill='none'/>

  <!-- Center Swag -->
  <path d='M195 50 Q300 175 405 50' stroke='#FEF08A' stroke-width='16' stroke-linecap='round' fill='none'/>
  <path d='M195 50 Q300 175 405 50' stroke='#FACC15' stroke-width='7' stroke-dasharray='7 9' fill='none'/>

  <!-- Right Swag -->
  <path d='M390 50 Q480 155 570 45' stroke='#FEF08A' stroke-width='14' stroke-linecap='round' fill='none'/>
  <path d='M390 50 Q480 155 570 45' stroke='#FACC15' stroke-width='6' stroke-dasharray='6 8' fill='none'/>

  <!-- Secondary Lower Thin Pearl/Jasmine Garlands -->
  <path d='M60 45 Q120 185 180 50' stroke='#FFFFFF' stroke-width='5' stroke-dasharray='5 7' fill='none' opacity='0.9'/>
  <path d='M230 50 Q300 205 370 50' stroke='#FFFFFF' stroke-width='6' stroke-dasharray='5 8' fill='none' opacity='0.9'/>
  <path d='M420 50 Q480 185 540 45' stroke='#FFFFFF' stroke-width='5' stroke-dasharray='5 7' fill='none' opacity='0.9'/>

  <!-- Hanging Lotus Bud Pendants / Tassels -->
  <!-- Left Swag Lotus -->
  <g transform='translate(120, 150)'>
    <line x1='0' y1='0' x2='0' y2='25' stroke='#CA8A04' stroke-width='3'/>
    <circle cx='0' cy='25' r='4' fill='#FDE047'/>
    <!-- Pink Lotus Bud -->
    <path d='M0 25 C-12 35 -15 55 0 68 C15 55 12 35 0 25 Z' fill='#E11D48'/>
    <path d='M0 25 C-6 35 -8 50 0 62 C8 50 6 35 0 25 Z' fill='#FDA4AF'/>
    <!-- Sepals -->
    <path d='M0 68 L-8 62 L0 60 L8 62 Z' fill='#15803D'/>
  </g>

  <!-- Left-Center Lotus -->
  <g transform='translate(210, 115)'>
    <line x1='0' y1='0' x2='0' y2='20' stroke='#CA8A04' stroke-width='2.5'/>
    <circle cx='0' cy='20' r='3.5' fill='#FDE047'/>
    <path d='M0 20 C-10 28 -12 45 0 55 C12 45 10 28 0 20 Z' fill='#E11D48'/>
    <path d='M0 20 C-5 28 -6 40 0 50 C6 40 5 28 0 20 Z' fill='#FDA4AF'/>
  </g>

  <!-- Right-Center Lotus -->
  <g transform='translate(390, 115)'>
    <line x1='0' y1='0' x2='0' y2='20' stroke='#CA8A04' stroke-width='2.5'/>
    <circle cx='0' cy='20' r='3.5' fill='#FDE047'/>
    <path d='M0 20 C-10 28 -12 45 0 55 C12 45 10 28 0 20 Z' fill='#E11D48'/>
    <path d='M0 20 C-5 28 -6 40 0 50 C6 40 5 28 0 20 Z' fill='#FDA4AF'/>
  </g>

  <!-- Right Swag Lotus -->
  <g transform='translate(480, 150)'>
    <line x1='0' y1='0' x2='0' y2='25' stroke='#CA8A04' stroke-width='3'/>
    <circle cx='0' cy='25' r='4' fill='#FDE047'/>
    <path d='M0 25 C-12 35 -15 55 0 68 C15 55 12 35 0 25 Z' fill='#E11D48'/>
    <path d='M0 25 C-6 35 -8 50 0 62 C8 50 6 35 0 25 Z' fill='#FDA4AF'/>
    <path d='M0 68 L-8 62 L0 60 L8 62 Z' fill='#15803D'/>
  </g>

  <!-- Central Hanging Lotus Tassel -->
  <g transform='translate(300, 172)'>
    <line x1='0' y1='0' x2='0' y2='30' stroke='#CA8A04' stroke-width='3.5'/>
    <circle cx='0' cy='30' r='5' fill='#FDE047'/>
    <path d='M0 30 C-15 42 -18 68 0 82 C18 68 15 42 0 30 Z' fill='#BE123C'/>
    <path d='M0 30 C-8 42 -10 60 0 74 C10 60 8 42 0 30 Z' fill='#FB7185'/>
    <path d='M0 82 L-10 75 L0 72 L10 75 Z' fill='#15803D'/>
  </g>

  <!-- =====================================================================
       SACRED DIVINE GANESHA CALLIGRAPHY MOTIF (CENTERPIECE)
       ===================================================================== -->
  <g transform='translate(235, 235)' filter='url(#divineGlow)'>
    <!-- Divine Radiance Background Aura -->
    <circle cx='65' cy='80' r='75' fill='rgba(254, 240, 138, 0.25)'/>

    <!-- Stylized Lord Ganesha Calligraphy Path in Sindoor Red & Gold -->
    <!-- Crown / Mukut / Pagdi -->
    <path d='M65 15 C58 15 52 20 52 26 C52 30 56 34 65 34 C74 34 78 30 78 26 C78 20 72 15 65 15 Z' fill='none' stroke='url(#ganeshaRed)' stroke-width='4.5' stroke-linecap='round'/>
    <path d='M58 22 C62 18 68 18 72 22' stroke='url(#goldShimmer)' stroke-width='3' stroke-linecap='round' fill='none'/>
    <path d='M65 15 L65 5' stroke='url(#goldShimmer)' stroke-width='4' stroke-linecap='round'/>
    <circle cx='65' cy='3' r='3.5' fill='url(#goldShimmer)'/>

    <!-- Tilak / Trishul on Forehead -->
    <path d='M65 35 L65 52' stroke='url(#ganeshaRed)' stroke-width='4' stroke-linecap='round'/>
    <circle cx='65' cy='42' r='3' fill='url(#goldShimmer)'/>

    <!-- Face, Large Ear & Curled Trunk (Continuous Sacred Om & Ganesha Flow) -->
    <!-- Right Ear / Om Loop Upper -->
    <path d='M52 32 C38 34 26 46 26 62 C26 78 38 90 54 90 C62 90 70 86 75 80' 
          fill='none' stroke='url(#ganeshaRed)' stroke-width='5.5' stroke-linecap='round'/>

    <!-- Left Brow, Eye curve and Divine Head -->
    <path d='M65 36 C76 36 88 44 92 56 C94 62 92 68 86 72' 
          fill='none' stroke='url(#ganeshaRed)' stroke-width='5' stroke-linecap='round'/>

    <!-- Sacred Modak / Sweet Offering in Hand -->
    <circle cx='24' cy='82' r='6' fill='url(#goldShimmer)'/>

    <!-- Graceful Curving Trunk (Sond) curling around the Modak -->
    <path d='M65 54 C65 68 62 85 58 100 C54 116 45 132 30 138 C22 141 14 135 15 125 C16 116 26 112 36 114 C44 116 48 122 45 130' 
          fill='none' stroke='url(#ganeshaRed)' stroke-width='5' stroke-linecap='round'/>

    <!-- Lower Belly / Om Kar Bottom Curve -->
    <path d='M42 98 C48 112 60 128 78 128 C96 128 108 114 108 96 C108 80 94 70 82 74 C75 76 72 82 76 88 C80 94 88 92 90 86' 
          fill='none' stroke='url(#ganeshaRed)' stroke-width='5' stroke-linecap='round'/>

    <!-- Sacred ॐ (Om) Tail Accent -->
    <path d='M88 64 C96 58 105 58 112 65 C118 71 116 80 110 82' 
          fill='none' stroke='url(#goldShimmer)' stroke-width='4' stroke-linecap='round'/>
    <path d='M110 50 C114 47 120 48 124 52' 
          fill='none' stroke='url(#goldShimmer)' stroke-width='3' stroke-linecap='round'/>
    <circle cx='124' cy='43' r='2.5' fill='url(#goldShimmer)'/>
  </g>

  <!-- Shower of Floating Red & Coral Rose Petals -->
  <g fill='url(#rosePetal1)' opacity='0.85'>
    <!-- Left falling petals -->
    <path d='M100 240 C95 230 115 225 120 235 C125 245 105 250 100 240 Z' transform='rotate(25, 110, 235)'/>
    <path d='M160 320 C155 312 172 308 176 316 C180 324 165 328 160 320 Z' transform='rotate(-40, 168, 316)'/>
    
    <!-- Center floating petals around Ganesha -->
    <path d='M315 210 C310 200 330 195 335 205 C340 215 320 220 315 210 Z' transform='rotate(15, 325, 205)'/>
    <path d='M210 280 C204 270 226 264 232 274 C238 284 216 290 210 280 Z' transform='rotate(55, 218, 277)'/>
    <path d='M370 290 C364 280 386 274 392 284 C398 294 376 300 370 290 Z' transform='rotate(-25, 380, 287)'/>
    
    <!-- Right falling petals -->
    <path d='M440 230 C435 220 455 215 460 225 C465 235 445 240 440 230 Z' transform='rotate(30, 450, 225)'/>
    <path d='M500 310 C495 302 512 298 516 306 C520 314 505 318 500 310 Z' transform='rotate(-50, 508, 306)'/>
  </g>
</svg>