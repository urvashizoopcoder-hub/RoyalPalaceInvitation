<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 700' width='100%' height='100%'>
  <defs>
    <linearGradient id='rBg' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#0B0F19'/>
      <stop offset='60%' stop-color='#1E1B4B'/>
      <stop offset='100%' stop-color='#090D16'/>
    </linearGradient>
    <linearGradient id='crystalGlow' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FFFFFF'/>
      <stop offset='50%' stop-color='#E0F2FE'/>
      <stop offset='100%' stop-color='#38BDF8'/>
    </linearGradient>
  </defs>
  <rect width='600' height='700' fill='url(#rBg)'/>
  <!-- Palace Grand Crystal Chandelier -->
  <line x1='300' y1='0' x2='300' y2='120' stroke='#D4AF37' stroke-width='4'/>
  <ellipse cx='300' cy='120' rx='90' ry='15' fill='#D4AF37'/>
  <path d='M220 125 Q300 180 380 125' stroke='url(#crystalGlow)' stroke-width='6' fill='none'/>
  <circle cx='300' cy='160' r='10' fill='#FFF'/>
  <!-- Couple in Black Tie & Emerald Gown -->
  <g transform='translate(80, 50)'>
    <!-- Groom Black Tuxedo -->
    <path d='M250 230 C220 230 200 260 195 300 L190 480 L320 480 L315 300 C310 260 290 230 260 230 Z' fill='#111827'/>
    <polygon points='255,235 240,290 270,290' fill='#FFF'/>
    <polygon points='255,250 265,260 245,260' fill='#000'/>
    <ellipse cx='255' cy='185' rx='30' ry='38' fill='#E5E7EB'/>
  </g>
  <g transform='translate(-30, 50)'>
