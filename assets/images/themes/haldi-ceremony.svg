<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 700' width='100%' height='100%'>
  <defs>
    <linearGradient id='hBg' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#FEF3C7'/>
      <stop offset='60%' stop-color='#FDE68A'/>
      <stop offset='100%' stop-color='#FCD34D'/>
    </linearGradient>
    <linearGradient id='marigold' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#F59E0B'/>
      <stop offset='100%' stop-color='#D97706'/>
    </linearGradient>
    <linearGradient id='saffronSilk' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FBBF24'/>
      <stop offset='100%' stop-color='#B45309'/>
    </linearGradient>
  </defs>
  <rect width='600' height='700' fill='url(#hBg)'/>
  <!-- Hanging Yellow Marigold Toran Bells -->
  <path d='M0 60 Q150 140 300 60 Q450 140 600 60' stroke='#D97706' stroke-width='6' fill='none'/>
  <g fill='url(#marigold)'>
    <circle cx='75' cy='105' r='14'/><circle cx='150' cy='115' r='16'/><circle cx='225' cy='105' r='14'/>
    <circle cx='375' cy='105' r='14'/><circle cx='450' cy='115' r='16'/><circle cx='525' cy='105' r='14'/>
  </g>
  <!-- Brass Urlis with Turmeric & Petals -->
  <ellipse cx='300' cy='520' rx='180' ry='50' fill='#B45309'/>
  <ellipse cx='300' cy='515' rx='170' ry='42' fill='#D97706'/>
  <ellipse cx='300' cy='510' rx='155' ry='35' fill='#FBBF24'/>
  <!-- Couple Blessed in Saffron Yellows -->
  <ellipse cx='260' cy='320' rx='35' ry='45' fill='#F59E0B'/>
  <ellipse cx='340' cy='330' rx='34' ry='44' fill='#D97706'/>
  <path d='M190 390 Q260 360 330 390 L310 490 L210 490 Z' fill='url(#saffronSilk)'/>
  <path d='M290 390 Q340 360 390 390 L380 490 L300 490 Z' fill='#EA580C'/>
  <!-- Marigold Petals Shower -->
  <g fill='#F59E0B'>
    <circle cx='200' cy='160' r='8'/><circle cx='390' cy='180' r='9'/><circle cx='140' cy='280' r='8'/><circle cx='460' cy='290' r='8'/>
