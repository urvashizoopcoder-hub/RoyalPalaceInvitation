<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 700' width='100%' height='100%'>
  <defs>
    <linearGradient id='pBg' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#450A0A'/>
      <stop offset='60%' stop-color='#7F1D1D'/>
      <stop offset='100%' stop-color='#1E0505'/>
    </linearGradient>
    <linearGradient id='goldMandap' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FDE047'/>
      <stop offset='50%' stop-color='#D4AF37'/>
      <stop offset='100%' stop-color='#996515'/>
    </linearGradient>
    <radialGradient id='fireGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#FDE047'/>
      <stop offset='50%' stop-color='#F97316'/>
      <stop offset='100%' stop-color='transparent'/>
    </radialGradient>
  </defs>
  <rect width='600' height='700' fill='url(#pBg)'/>
  <!-- Sacred Mandap Golden Pillars -->
  <rect x='100' y='60' width='30' height='480' rx='6' fill='url(#goldMandap)'/>
  <rect x='470' y='60' width='30' height='480' rx='6' fill='url(#goldMandap)'/>
  <path d='M70 70 Q300 0 530 70' stroke='url(#goldMandap)' stroke-width='24' fill='none'/>
  <!-- Sacred Agni Kund (Fire) -->
  <polygon points='230,520 370,520 340,560 260,560' fill='url(#goldMandap)'/>
  <circle cx='300' cy='480' r='70' fill='url(#fireGlow)'/>
  <polygon points='300,430 320,490 280,490' fill='#FDE047'/>
  <polygon points='300,440 315,485 288,485' fill='#DC2626'/>
  <!-- Royal Couple Taking Pheras -->
  <path d='M200 320 C180 320 160 360 160 490 L270 490 L260 370 Z' fill='#991B1B'/>
  <path d='M320 300 C300 300 280 350 280 490 L400 490 L380 360 Z' fill='#D4AF37'/>
  <!-- Gathbandhan Holy Knot -->
  <path d='M240 400 Q280 430 320 400' stroke='#FDE047' stroke-width='6' fill='none'/>
  <!-- Rose Petals Shower -->
  <g fill='#F43F5E'>
    <circle cx='210' cy='180' r='8'/><circle cx='380' cy='190' r='9'/><circle cx='150' cy='280' r='7'/><circle cx='440' cy='260' r='8'/>
  </g>
</svg>