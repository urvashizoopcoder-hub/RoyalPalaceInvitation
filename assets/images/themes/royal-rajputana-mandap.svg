<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">

        <!-- Grand Palace Courtyard with Arch & Royal Elephant -->
        <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b030b"/><stop offset="100%" stop-color="#7a0d1e"/></linearGradient>
            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd700"/><stop offset="100%" stop-color="#b8860b"/></linearGradient>
        </defs>
        <rect width="800" height="450" fill="url(#bg)"/>
        <!-- Palace Arch Structure -->
        <path d="M100 450 L100 200 C100 120 250 80 400 80 C550 80 700 120 700 200 L700 450 Z" fill="#290207" stroke="url(#gold)" stroke-width="3"/>
        <path d="M160 450 L160 220 C160 150 280 120 400 120 C520 120 640 150 640 220 L640 450 Z" fill="#1f0205" stroke="url(#gold)" stroke-width="2"/>
        <!-- Mandap Dome & Kalash -->
        <path d="M340 120 C340 70 400 30 400 30 C400 30 460 70 460 120 Z" fill="url(#gold)"/>
        <circle cx="400" cy="20" r="8" fill="#ffd700"/>
        <!-- Royal Elephant with Howdah -->
        <path d="M380 340 C360 300 440 300 420 340 Z" fill="url(#gold)"/>
        <circle cx="400" cy="360" r="30" fill="url(#gold)"/>
        <path d="M350 420 C350 360 450 360 450 420 L450 450 L350 450 Z" fill="url(#gold)"/>
        <!-- Marigold Garlands -->
        <path d="M120 210 Q 260 260 400 210 Q 540 260 680 210" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="12,6"/>
        <path d="M140 250 Q 270 300 400 250 Q 530 300 660 250" fill="none" stroke="#ea580c" stroke-width="6" stroke-dasharray="10,5"/>
        <text x="400" y="290" font-family="'Cinzel Decorative', serif" font-size="28" fill="#ffd700" text-anchor="middle" letter-spacing="4">RAJPUTANA ROYAL MANDAP</text>
        <text x="400" y="320" font-family="'Cormorant Garamond', serif" font-size="16" fill="#fef3c7" text-anchor="middle" font-style="italic">Shahi Vivaah Celebrations</text>
    
</svg>