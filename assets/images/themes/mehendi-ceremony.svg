<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 700' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#FFF1F2'/>
      <stop offset='60%' stop-color='#FCE7F3'/>
      <stop offset='100%' stop-color='#F3E8FF'/>
    </linearGradient>
    <linearGradient id='palaceStone' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FFFBEB'/>
      <stop offset='100%' stop-color='#FEF3C7'/>
    </linearGradient>
    <linearGradient id='greenSilk' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#34D399'/>
      <stop offset='100%' stop-color='#059669'/>
    </linearGradient>
    <linearGradient id='pinkSilk' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#F472B6'/>
      <stop offset='100%' stop-color='#DB2777'/>
    </linearGradient>
    <linearGradient id='goldZari' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FDE047'/>
      <stop offset='50%' stop-color='#D4AF37'/>
      <stop offset='100%' stop-color='#996515'/>
    </linearGradient>
  </defs>

  <!-- Sky & Palace Courtyard Background -->
  <rect width='600' height='700' fill='url(#bgGrad)'/>

  <!-- Distant Udaipur Palace Jharokha Pillars -->
  <path d='M80 0 L80 400 M520 0 L520 400' stroke='#E2E8F0' stroke-width='40' opacity='0.4'/>
  <path d='M80 200 Q300 100 520 200' stroke='#CBD5E1' stroke-width='20' fill='none' opacity='0.4'/>

  <!-- Hanging Rose & Jasmine Floral Garlands (Swing Vines) -->
  <path d='M140 0 Q150 250 160 500' stroke='#059669' stroke-width='8' fill='none'/>
  <path d='M460 0 Q450 250 440 500' stroke='#059669' stroke-width='8' fill='none'/>

  <!-- Blossom Clusters on Garland Vines -->
  <g fill='#F43F5E'>
    <circle cx='140' cy='80' r='12'/><circle cx='155' cy='140' r='14'/><circle cx='148' cy='210' r='13'/>
    <circle cx='158' cy='280' r='14'/><circle cx='152' cy='360' r='15'/><circle cx='162' cy='440' r='14'/>
    <circle cx='460' cy='80' r='12'/><circle cx='445' cy='140' r='14'/><circle cx='452' cy='210' r='13'/>
    <circle cx='442' cy='280' r='14'/><circle cx='448' cy='360' r='15'/><circle cx='438' cy='440' r='14'/>
  </g>
  <g fill='#FDE047'>
    <circle cx='146' cy='110' r='8'/><circle cx='150' cy='175' r='8'/><circle cx='162' cy='245' r='8'/>
    <circle cx='454' cy='110' r='8'/><circle cx='450' cy='175' r='8'/><circle cx='438' cy='245' r='8'/>
  </g>

  <!-- Groom (Sage Green Silk Kurta) -->
  <g transform='translate(80, 40)'>
    <path d='M260 220 C230 220 210 245 205 280 C200 320 200 480 200 500 L380 500 L370 280 C365 245 345 220 315 220 Z' fill='url(#greenSilk)'/>
    <!-- Groom Gold Collar & Placket -->
    <path d='M285 220 L285 340' stroke='url(#goldZari)' stroke-width='6'/>
    <!-- Groom Head Silhouette -->
    <ellipse cx='285' cy='175' rx='36' ry='44' fill='#D97706'/>
    <path d='M250 165 C250 135 270 125 295 125 C320 125 330 145 325 170 C315 160 300 155 285 155 C270 155 255 160 250 165 Z' fill='#1F2937'/>
  </g>

  <!-- Bride (Blush Pink & Emerald Gold Embroidered Lehenga & Dupatta) -->
  <g transform='translate(-30, 60)'>
    <!-- Dupatta Drape -->
    <path d='M230 180 C200 180 160 260 140 460 C200 470 280 470 340 460 C320 260 280 180 230 180 Z' fill='url(#pinkSilk)' opacity='0.85'/>
    <path d='M230 180 C200 180 160 260 140 460' stroke='url(#goldZari)' stroke-width='8' fill='none'/>
    <!-- Blouse Choli -->
    <path d='M200 310 Q240 280 280 310 L275 420 L205 420 Z' fill='url(#greenSilk)'/>
    <!-- Gold Necklace & Kundan Choker -->
    <path d='M215 270 Q240 310 265 270' stroke='url(#goldZari)' stroke-width='8' fill='none'/>
    <!-- Bride Head -->
    <ellipse cx='240' cy='205' rx='34' ry='42' fill='#FBBF24'/>
    <!-- Bride Hair & Maang Tikka -->
    <path d='M205 200 C205 165 225 155 250 155 C275 155 285 175 280 200 C270 190 255 185 240 185 C225 185 210 190 205 200 Z' fill='#1F2937'/>
    <circle cx='240' cy='165' r='5' fill='url(#goldZari)'/>
    <line x1='240' y1='155' x2='240' y2='175' stroke='url(#goldZari)' stroke-width='3'/>
  </g>

  <!-- Floating Falling Petals -->
  <g fill='#FB7185' opacity='0.7'>
    <circle cx='90' cy='120' r='6'/><circle cx='240' cy='70' r='8'/><circle cx='410' cy='110' r='7'/>
    <circle cx='180' cy='320' r='6'/><circle cx='510' cy='260' r='9'/><circle cx='360' cy='420' r='7'/>
  </g>
</svg>